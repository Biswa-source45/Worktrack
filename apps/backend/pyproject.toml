[project]
name = "worktrack-backend"
version = "0.1.0"
description = "WorkTrack API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "arq>=0.28.0",
    "asyncpg>=0.31.0",
    "boto3>=1.43.108",
    "cryptography>=50.0.2",
    "fastapi>=0.142.2",
    "geoalchemy2>=0.20.0",
    "httpx>=0.28.1",
    "opencv-python-headless==4.14.0.94",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "redis>=5.3.1",
    "sqlalchemy[asyncio]>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false
dev-dependencies = [
    "asyncpg-stubs>=0.31.3",
    "boto3-stubs[s3]>=1.43.108",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "types-openpyxl>=3.1.5.20260827",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
